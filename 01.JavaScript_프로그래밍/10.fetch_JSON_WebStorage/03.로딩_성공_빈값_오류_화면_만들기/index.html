<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>공지 요청 상태</title>
    <script src="./main.js" defer></script>
  </head>
  <body>
    <h1>공지 목록</h1>
    <label for="source">확인할 응답</label>
    <select id="source">
      <option value="./data/notices.json">정상 목록</option>
      <option value="./data/empty.json">빈 목록</option>
      <option value="./data/missing.json">없는 파일 (404)</option>
    </select>
    <button id="reload" type="button">불러오기 / 다시 시도</button>
    <p id="status" aria-live="polite"></p>
    <ul id="notices"></ul>
  </body>
</html>
