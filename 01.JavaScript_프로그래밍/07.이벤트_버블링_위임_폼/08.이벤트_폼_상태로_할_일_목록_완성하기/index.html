<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>학습 할 일</title>
    <script src="./main.js" defer></script>
  </head>
  <body>
    <h1>학습 할 일</h1>
    <form class="todo-form">
      <label for="todo-title">할 일</label>
      <input id="todo-title" name="title" aria-describedby="todo-status" />
      <button type="submit">추가</button>
    </form>
    <p id="todo-status" class="todo-status" aria-live="polite"></p>
    <ul class="todo-list"></ul>
  </body>
</html>
